# Personal secrets come from a private overlay repo (alliecatowo/dotfiles-private), never this one.
# It holds sops files encrypted to age keys, which mise decrypts itself with no sops binary.
# The age identity lives at ~/.config/mise/age.txt (gitignored) and is backed up in Bitwarden.
# Set it up with `mise run setup:secrets`. Until then the file is missing and mise skips it,
# so run `mise run doctor` to confirm the secrets actually load.

[settings]
age.key_file = "~/.config/mise/age.txt"

[env]
_.file = { path = "~/.local/share/dotfiles-private/shell.enc.json", redact = true }
