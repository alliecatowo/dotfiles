# ── macOS: formulae that mise [tools] can't provide ──
"brew:mas" = { os = "macos" }
"brew:git" = { os = "macos" }
"brew:task" = { os = "macos" }   # taskwarrior; mise's `task` is go-task, a different tool

# ── macOS: App Store (sign in to the App Store app first) ──
"mas:937984704" = { os = "macos" }   # Amphetamine
"mas:497799835" = { os = "macos" }   # Xcode

# ── Fedora (GNOME) ──
"dnf:zsh" = { os = "linux" }
"dnf:git" = { os = "linux" }
"dnf:gcc" = { os = "linux" }
"dnf:make" = { os = "linux" }
"dnf:task" = { os = "linux" }
"flatpak:com.discordapp.Discord" = { os = "linux" }
"flatpak:com.spotify.Client" = { os = "linux" }
"flatpak:com.bitwarden.desktop" = { os = "linux" }
"flatpak:com.google.Chrome" = { os = "linux" }
"flatpak:app.zen_browser.zen" = { os = "linux" }

# Glassy: a third-party cask needs Ruby 3 for mise to evaluate it, and a fresh Mac has only 2.6,
# so install it from the release directly. Bump version and sha256 with each release.
[bootstrap.packages."macos-app:glassy"]
version = "0.6.2"
url = "https://github.com/alliecatowo/glassy/releases/download/v{{version}}/glassy-{{version}}-macos-aarch64.dmg"
sha256 = "9c69bb527fa041be934b56829a5dbd7f8d5f0dbaaf161324846cd4f5453accdb"
artifact = "Glassy.app"
os = "macos/arm64"

[bootstrap.hooks]
pre-packages = """
if [ "$(uname -s)" = Darwin ] && [ ! -x /opt/homebrew/bin/brew ]; then
  NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
"""
# Glassy is unsigned. The tap's cask clears quarantine for Glassy.app only; do the same here.
post-packages = "[ -d /Applications/Glassy.app ] && xattr -dr com.apple.quarantine /Applications/Glassy.app || true"
