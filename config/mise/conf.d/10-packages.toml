# GUI apps and system packages. CLI tools belong in [tools] (config.toml), not here.
# On macOS, real Homebrew is installed too (pre-packages hook below) so `brew` works for one-offs,
# and homebrew_metadata hands mise-installed casks to Homebrew so `brew upgrade` sees everything.
# This file stays the source of truth: add apps here, not with `brew install`.

[bootstrap.brew]
homebrew_metadata = true
# Entries for a package manager this OS doesn't have are skipped.
# Commented lines are suggestions found while surveying the old laptop; uncomment to adopt.

[bootstrap.packages]
# ── macOS: casks ──
"brew-cask:ghostty" = { os = "macos", adopt = true }
"brew-cask:raycast" = { os = "macos", adopt = true }
"brew-cask:rectangle-pro" = { os = "macos", adopt = true }
"brew-cask:orbstack" = { os = "macos", adopt = true }
"brew-cask:tailscale-app" = { os = "macos", adopt = true }
"brew-cask:claude" = { os = "macos", adopt = true }
"brew-cask:google-chrome" = { os = "macos", adopt = true }
"brew-cask:zen" = { os = "macos", adopt = true }
"brew-cask:discord" = { os = "macos", adopt = true }
"brew-cask:spotify" = { os = "macos", adopt = true }
"brew-cask:visual-studio-code" = { os = "macos", adopt = true }
"brew-cask:cmux" = { os = "macos", adopt = true }
"brew-cask:tableplus" = { os = "macos", adopt = true }
"brew-cask:bitwarden" = { os = "macos", adopt = true }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
